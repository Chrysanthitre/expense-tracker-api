<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-gray-900 border-b border-gray-800 px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-500 rounded-lg p-2">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <span class="text-lg font-semibold text-white">Expense Tracker</span>
        </div>
        <span class="text-sm text-gray-400">Spring Boot REST API</span>
    </nav>

    <div class="max-w-5xl mx-auto px-6 py-10 space-y-10">

        <!-- ADD EXPENSE FORM -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
            <h2 class="text-base font-semibold text-white mb-5">Add New Expense</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-400 font-medium">Amount (€)</label>
                    <input id="amount" type="number" placeholder="0.00"
                        class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition" />
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-400 font-medium">Category</label>
                    <select id="category"
                        class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="" disabled selected>Select category</option>
                        <option value="FOOD">Food</option>
                        <option value="TRANSPORT">Transport</option>
                        <option value="SHOPPING">Shopping</option>
                        <option value="HEALTH">Health</option>
                        <option value="ENTERTAINMENT">Entertainment</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-400 font-medium">Description</label>
                    <input id="description" type="text" placeholder="Optional"
                        class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition" />
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-400 font-medium">Date</label>
                    <input id="date" type="date"
                        class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition" />
                </div>
            </div>
            <button onclick="createExpense()"
                class="mt-5 bg-emerald-500 hover:bg-emerald-400 text-white text-sm font-semibold px-6 py-2.5 rounded-lg transition">
                + Add Expense
            </button>
            <p id="form-msg" class="mt-3 text-sm text-emerald-400 hidden"></p>
        </div>

        <!-- ANALYTICS -->
        <div>
            <h2 class="text-base font-semibold text-white mb-4">Analytics by Category</h2>
            <div id="analytics-cards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                <p class="text-gray-500 text-sm">Loading...</p>
            </div>
        </div>

        <!-- ANALYTICS BY MONTH -->
        <div>
            <h2 class="text-base font-semibold text-white mb-4">Analytics by Month</h2>
            <div id="month-cards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                <p class="text-gray-500 text-sm">Loading...</p>
            </div>
        </div>

        <!-- EXPENSES TABLE -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-semibold text-white">All Expenses</h2>
                <span id="expense-count" class="text-xs text-gray-400 bg-gray-800 px-3 py-1 rounded-full"></span>
            </div>

            <div class="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs text-gray-400 uppercase tracking-wide">
                            <th class="px-6 py-4 text-left">Date</th>
                            <th class="px-6 py-4 text-left">Category</th>
                            <th class="px-6 py-4 text-left">Description</th>
                            <th class="px-6 py-4 text-right">Amount</th>
                            <th class="px-6 py-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-table">
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-gray-500">Loading expenses...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const API = "http://localhost:8080";

        const CATEGORY_COLORS = {
            FOOD: "bg-orange-500/10 text-orange-400",
            TRANSPORT: "bg-blue-500/10 text-blue-400",
            SHOPPING: "bg-pink-500/10 text-pink-400",
            HEALTH: "bg-red-500/10 text-red-400",
            ENTERTAINMENT: "bg-purple-500/10 text-purple-400",
            OTHER: "bg-gray-500/10 text-gray-400",
        };

        // ── 1. GET /expenses ──────────────────────────────────────────
        async function loadExpenses() {
            const res = await fetch(`${API}/expenses`);
            const data = await res.json();
            const tbody = document.getElementById("expenses-table");
            const count = document.getElementById("expense-count");

            count.textContent = `${data.length} expenses`;

            if (data.length === 0) {
                tbody.innerHTML = `
          <tr>
            <td colspan="5" class="px-6 py-10 text-center text-gray-500">No expenses yet. Add one above!</td>
          </tr>`;
                return;
            }

            tbody.innerHTML = data.map(e => `
        <tr class="border-t border-gray-800 hover:bg-gray-800/50 transition fade-in">
          <td class="px-6 py-4 text-gray-300">${e.date}</td>
          <td class="px-6 py-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-medium ${CATEGORY_COLORS[e.category] || CATEGORY_COLORS.OTHER}">
              ${e.category}
            </span>
          </td>
          <td class="px-6 py-4 text-gray-400">${e.description || "—"}</td>
          <td class="px-6 py-4 text-right font-semibold text-white">€${e.amount.toFixed(2)}</td>
          <td class="px-6 py-4 text-center">
            <button onclick="deleteExpense(${e.id})"
              class="text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 px-3 py-1.5 rounded-lg transition">
              Delete
            </button>
          </td>
        </tr>
      `).join("");
        }

        // ── 2. POST /expenses ─────────────────────────────────────────
        async function createExpense() {
            const amount = document.getElementById("amount").value;
            const category = document.getElementById("category").value;
            const description = document.getElementById("description").value;
            const date = document.getElementById("date").value;
            const msg = document.getElementById("form-msg");

            if (!amount || !category || !date) {
                msg.textContent = "Please fill in Amount, Category and Date.";
                msg.className = "mt-3 text-sm text-red-400";
                msg.classList.remove("hidden");
                return;
            }

            await fetch(`${API}/expenses`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ amount: parseFloat(amount), category, description, date })
            });

            // Καθάρισε τα fields
            document.getElementById("amount").value = "";
            document.getElementById("category").value = "";
            document.getElementById("description").value = "";
            document.getElementById("date").value = "";

            msg.textContent = "Expense added!";
            msg.className = "mt-3 text-sm text-emerald-400";
            msg.classList.remove("hidden");
            setTimeout(() => msg.classList.add("hidden"), 2000);

            loadExpenses();
            loadAnalytics();
            loadMonthlyAnalytics();
        }

        // ── 3. DELETE /expenses/{id} ──────────────────────────────────
        async function deleteExpense(id) {
            await fetch(`${API}/expenses/${id}`, { method: "DELETE" });
            loadExpenses();
            loadAnalytics();
            loadMonthlyAnalytics();
        }

        // ── 4. GET /expenses/analytics/category ──────────────────────
        async function loadAnalytics() {
            const res = await fetch(`${API}/expenses/analytics/category`);
            const data = await res.json();
            const container = document.getElementById("analytics-cards");

            if (data.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm">No data yet.</p>`;
                return;
            }

            container.innerHTML = data.map(([category, total]) => `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 fade-in">
          <span class="text-xs font-medium px-2 py-1 rounded-full ${CATEGORY_COLORS[category] || CATEGORY_COLORS.OTHER}">
            ${category}
          </span>
          <p class="mt-3 text-xl font-bold text-white">€${total.toFixed(2)}</p>
          <p class="text-xs text-gray-500 mt-1">Total spent</p>
        </div>
      `).join("");
        }

        // ── 5. GET /expenses/analytics/month ─────────────────────────
        const MONTH_NAMES = {
            1: "January", 2: "February", 3: "March", 4: "April",
            5: "May", 6: "June", 7: "July", 8: "August",
            9: "September", 10: "October", 11: "November", 12: "December"
        };

        async function loadMonthlyAnalytics() {
            const res = await fetch(`${API}/expenses/analytics/month`);
            const data = await res.json();
            const container = document.getElementById("month-cards");

            if (data.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm">No data yet.</p>`;
                return;
            }

            container.innerHTML = data.map(([month, total]) => `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 fade-in">
          <span class="text-xs font-medium px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-400">
            ${MONTH_NAMES[month] || "Month " + month}
          </span>
          <p class="mt-3 text-xl font-bold text-white">€${total.toFixed(2)}</p>
          <p class="text-xs text-gray-500 mt-1">Total spent</p>
        </div>
      `).join("");
        }

        // ── Init ──────────────────────────────────────────────────────
        loadExpenses();
        loadAnalytics();
        loadMonthlyAnalytics();
    </script>

</body>

</html>
